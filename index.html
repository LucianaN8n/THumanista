<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>THSE – Mentor Humanista</title>
  <meta name="description" content="Anamnese guiada, protocolo sugerido e PDF com layout clínico.">
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" defer src="./js/app.js"></script>
</head>
<body>
  <header class="wrap topbar">
    <h1>THSE – Mentor Humanista</h1>
    <button id="btn-pdf" class="btn ghost">📄 Baixar PDF</button>
  </header>

  <main class="wrap grid">
    <section class="card">
      <h2>1) Dados do paciente</h2>
      <div class="grid2">
        <label>Nome do paciente
          <input id="f-nome" type="text" placeholder="Ex.: Ana Souza">
        </label>
        <label>Queixa principal
          <input id="f-queixa" type="text" placeholder="Ex.: isolamento social">
        </label>
      </div>
      <div class="grid2">
        <label>Intensidade (0–10)
          <input id="f-intensidade" type="number" min="0" max="10" value="6">
        </label>
        <label>Quando piora?
          <input id="f-gatilho" type="text" placeholder="Ex.: sempre antes de reuniões">
        </label>
      </div>
      <div class="grid2">
        <label>O que o padrão “compra”?
          <select id="f-funcao">
            <option value="alivio">Alívio rápido</option>
            <option value="evitacao">Evitar conflito/situação</option>
            <option value="aprovacao">Buscar aprovação</option>
            <option value="controle">Controlar/rigidez</option>
          </select>
        </label>
        <label>Objetivo terapêutico (do paciente)
          <input id="f-objetivo" type="text" placeholder="Ex.: comunicar-se melhor, ampliar vínculos">
        </label>
      </div>
      <label>Preferências/limites (opcional)
        <input id="f-preferencias" type="text" placeholder="Ex.: prefiro exercícios de respiração a imaginação">
      </label>
    </section>

    <section class="card">
      <h2>2) Diretrizes clínicas (guia rápido)</h2>
      <div id="guides" class="guides"></div>
    </section>

    <section class="card">
      <div class="flex between">
        <h2>3) Protocolo sugerido (edite livremente)</h2>
        <button id="btn-gerar" class="btn">Gerar a partir da anamnese</button>
      </div>
      <div id="plano-editor" class="plan"></div>
    </section>
  </main>

  <footer class="wrap footer">
    <small>© Mentor Humanista — uso educacional. Você é o responsável técnico.</small>
  </footer>
</body>
</html>
