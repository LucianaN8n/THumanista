<main id="app" class="wrap main">
  <section class="card">
    <h2>Anamnese Humanista</h2>
    <div class="grid2">
      <label>Nome do cliente
        <input id="f-nome" type="text" placeholder="Ex.: Ana Lima">
      </label>
      <label>Queixa principal
        <input id="f-queixa" type="text" placeholder="Ex.: ansiedade leve">
      </label>
    </div>

    <label>Intensidade (0–10)
      <input id="f-intensidade" type="number" min="0" max="10" value="6">
    </label>

    <label>Quando piora?
      <input id="f-gatilho" type="text" placeholder="Ex.: à noite, antes de reuniões">
    </label>

    <label>O que esse padrão “compra” pra você?
      <select id="f-funcao">
        <option value="alivio">Alívio rápido</option>
        <option value="evitacao">Evitar conflito/situação</option>
        <option value="aprovacao">Buscar aprovação</option>
        <option value="controle">Controlar/rigidez</option>
      </select>
    </label>

    <label>Objetivo do cliente (1 frase)
      <input id="f-objetivo" type="text" placeholder="Ex.: falar em público com menos trêmula">
    </label>

    <label>Preferências/limites (opcional)
      <input id="f-preferencias" type="text" placeholder="Ex.: prefiro exercícios de respiração a imaginação">
    </label>

    <button id="btn-gerar" class="btn btn-primary" style="margin-top:10px">Gerar Protocolo</button>
  </section>

  <section id="editor" class="card" style="display:none">
    <h2>Protocolo sugerido (edite livremente)</h2>
    <div id="plano-editor"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button id="btn-pdf" class="btn btn-primary">Baixar PDF</button>
      <button id="btn-refazer" class="btn">Refazer a anamnese</button>
    </div>
  </section>
</main>
