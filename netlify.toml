# Netlify config — libera embed na Hotmart
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://*.hotmart.com https://hotmart.com https://*.hotmart.com.br;"
  Referrer-Policy = "no-referrer-when-downgrade"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "ALLOWALL"
  Permissions-Policy = "clipboard-write=(self)"
